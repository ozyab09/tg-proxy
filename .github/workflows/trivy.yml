name: Security Scan

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Scan weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  scan-relay:
    name: Scan relay image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: tg-proxy-relay:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "tg-proxy-relay:scan"
          format: "sarif"
          output: "trivy-relay.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-relay.sarif"

  scan-mtproxy:
    name: Scan mtproxy image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mtproxy/Dockerfile
          push: false
          load: true
          tags: tg-proxy-mtproto:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "tg-proxy-mtproto:scan"
          format: "sarif"
          output: "trivy-mtproxy.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-mtproxy.sarif"

  scan-shell:
    name: Scan shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
