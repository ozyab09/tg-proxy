name: Release

# Automatically bump the version, create a git tag, generate a changelog and
# publish a GitHub Release on every push to main that contains conventional
# commits (feat!, fix!, …).  The pushed tag v* triggers docker-image.yml
# which builds the release Docker images.
#
# Requires conventional-commit messages so that cocogitto can determine the
# next semver automatically:
#   feat:  → minor bump
#   fix:   → patch bump
#   feat!: → major bump
#
# If no qualifying commits exist since the last tag, the job exits cleanly
# without creating a new release.

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for version detection)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cocogitto
        run: |
          COG_VERSION=$(curl -fsSL https://api.github.com/repos/cocogitto/cocogitto/releases/latest \
            | grep '"tag_name"' | cut -d '"' -f 4)
          echo "Installing cocogitto ${COG_VERSION}"
          curl -fsSL \
            "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz
          # v7.0.0+ uses x86_64-unknown-linux-musl/ (no version prefix)
          COG_BIN=$(find . -path '*/cog' -type f | head -1)
          sudo mv "${COG_BIN}" /usr/local/bin/
          rm -rf x86_64-unknown-linux-musl/ cocogitto-*/
          cog --version

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          if cog bump --auto; then
            TAG=$(git describe --tags --abbrev=0)
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "New version: ${TAG}"
          else
            echo "No conventional commits to bump — skipping release."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changelog commit and tag
        if: steps.bump.outputs.bumped == 'true'
        env:
          # PAT is required so the tag push triggers docker-image.yml.
          # GITHUB_TOKEN cannot trigger other workflows (GitHub security).
          # Create a PAT with 'repo' scope and add it as repository secret
          # PAT_TOKEN. Falls back to GITHUB_TOKEN if PAT_TOKEN is not set.
          PAT: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes
