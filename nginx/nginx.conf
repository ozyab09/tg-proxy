user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log request URIs or headers: the bridge URL carries the derived
    # capability and the WebSocket carrier's session bearer travels in headers.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    # Default gzip_types only: encrypted carrier bodies
    # (application/octet-stream) are never compressed.

    include /etc/nginx/conf.d/*.conf;
}
